services:
  wordpress:
    image: wordpress:6.8-php8.2-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_DEBUG', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes/quangba:/var/www/html/wp-content/themes/quangba:ro
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m

  wordpress-setup:
    image: wordpress:cli-php8.2
    restart: "no"
    user: "33:33"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      set -eu;
      until wp core is-installed --path=/var/www/html >/dev/null 2>&1; do
        wp core install --path=/var/www/html
        --url="$${WORDPRESS_SITE_URL}"
        --title="Quang Ba San Pham"
        --admin_user="$${WORDPRESS_ADMIN_USER}"
        --admin_password="$${WORDPRESS_ADMIN_PASSWORD}"
        --admin_email="$${WORDPRESS_ADMIN_EMAIL}"
        --skip-email && break || sleep 5;
      done;
      wp theme activate quangba --path=/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-http://localhost}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?Set WORDPRESS_ADMIN_USER in .env}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?Set WORDPRESS_ADMIN_PASSWORD in .env}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.local}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes/quangba:/var/www/html/wp-content/themes/quangba:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init/02-create-exporter-user.sh:/docker-entrypoint-initdb.d/02-create-exporter-user.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - observability
    depends_on:
      - wordpress
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    depends_on:
      - nginx-exporter
      - mysqld-exporter
      - cadvisor
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - observability
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: exporter:${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}@(db:3306)/
    networks:
      - backend
      - observability
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability
    depends_on:
      - loki
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true

volumes:
  wordpress_data:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
